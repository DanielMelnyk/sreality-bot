name: Sreality check

on:
  schedule:
    # каждый час в 0 минут (UTC!)
    - cron: '0 * * * *'
  workflow_dispatch:
    # позволяет запускать вручную кнопкой в GitHub -- удобно для теста

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Run check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_new_listings.py

      - name: Commit updated database and photos back to repo
        run: |
          git config --global user.name "sreality-bot"
          git config --global user.email "sreality-bot@users.noreply.github.com"
          git add sreality_seen.db photos/
          git diff --staged --quiet || git commit -m "Update database and photos [skip ci]"
          git push